name: Feature request
description: An idea for the game, the hub or the word packs, especially a way to make it more your own.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with
      description: The moment at the table where you missed it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
